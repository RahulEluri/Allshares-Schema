[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-playground"
version = "0.1.0"
description = "Schema playground for the Allshares CDP BigQuery star schema"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=1.2",
  "openpyxl>=3.1",
  "sqlglot>=25",
  "pyyaml>=6",
  "filelock>=3.13",
  "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["schema_core", "schema_core.importer", "api", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
